name: iOS build and tests

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project SeaSignal.xcodeproj \
            -scheme SeaSignal \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Test when a simulator is installed
        run: |
          set -o pipefail
          DEVICE_ID="$(xcrun simctl list devices available -j | ruby -rjson -e '
            devices = JSON.parse(STDIN.read).fetch("devices", {})
            device = devices.values.flatten.find { |item| item["isAvailable"] }
            print device["udid"] if device
          ')"

          if [ -z "$DEVICE_ID" ]; then
            echo "::notice::No iOS Simulator runtime is installed on this runner; compile verification passed and device tests were skipped."
            exit 0
          fi

          xcodebuild \
            -project SeaSignal.xcodeproj \
            -scheme SeaSignal \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            test
